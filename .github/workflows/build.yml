name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на раннерах GitHub (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MASTER_PIN: ${{ secrets.MASTER_PIN }}
        run: |
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          set +e
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            # ошибки компиляции — в аннотации, чтобы их было видно без полного лога
            grep -E "^e: |What went wrong|error:" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            tail -25 build.log | while IFS= read -r l; do echo "::warning::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk colony-scanner.apk

      - uses: actions/upload-artifact@v5
        with:
          name: colony-scanner-apk
          path: colony-scanner.apk

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest colony-scanner.apk \
            --title "Сканер — сборка ${{ github.run_number }}" \
            --notes "Скачайте colony-scanner.apk на телефон и установите. Сборка ${{ github.run_number }}, коммит ${GITHUB_SHA::7}."
