name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MASTER_PIN: ${{ secrets.MASTER_PIN }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk colony-scanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: colony-scanner-apk
          path: colony-scanner.apk

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest colony-scanner.apk \
            --title "Сканер — сборка ${{ github.run_number }}" \
            --notes "Скачайте colony-scanner.apk на телефон и установите. Сборка ${{ github.run_number }}, коммит ${GITHUB_SHA::7}."
